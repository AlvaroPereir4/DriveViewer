<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - DriveViewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <h1 class="logo" style="text-align: center; margin-bottom: 20px;">Nova Senha</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 20px; text-align: center;">
            Defina sua nova senha pessoal. <br>
            <small style="color: #ffc107;">(Permitido apenas 1 vez a cada 24h)</small>
        </p>

        <form method="POST" action="/reset-password">
            <div class="form-group">
                <input type="password" name="new_password" placeholder="Nova Senha" required>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" placeholder="Confirme a Nova Senha" required>
            </div>
            <button type="submit" class="login-btn">Salvar Senha</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('index') }}" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Voltar</a>
        </div>
    </div>
</body>
</html>
