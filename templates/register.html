<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - DriveViewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-container">
        <h1 class="logo" style="text-align: center; margin-bottom: 30px; cursor: default;">Criar Conta</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <input type="text" name="username" placeholder="Escolha um Usuário" required autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Escolha uma Senha" required>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" placeholder="Confirme a Senha" required>
            </div>
            <button type="submit" class="login-btn">Registrar</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('login') }}" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Já tem conta? Entrar</a>
        </div>
    </div>

    <footer class="app-footer login-footer">
        <p>v{{ version }} | Developing in: <a href="{{ github_url }}" target="_blank">GitHub</a></p>
    </footer>

    <script>
        document.addEventListener('mousemove', (e) => {
            document.body.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.body.style.setProperty('--mouse-y', `${e.clientY}px`);
        });
    </script>
</body>
</html>
