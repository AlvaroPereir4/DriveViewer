<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveViewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo" onclick="loadHome()">DriveViewer</div>
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div class="nav-actions">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar...">
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Sair</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div id="items-count" class="items-count"></div>
    <main id="app-container" class="content-grid">
        <!-- O conteúdo será injetado aqui via JS -->
    </main>

    <!-- Video Modal -->
    <div id="video-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="video-wrapper">
                <iframe id="video-frame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <h2 id="modal-title"></h2>
        </div>
    </div>

    <footer class="app-footer">
        <p>v{{ version }} | Developing in: <a href="{{ github_url }}" target="_blank">GitHub</a></p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
