<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveViewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="loadHome()">DriveViewer</div>
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div class="nav-actions">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar...">
            </div>
            <a href="{{ url_for('settings') }}" class="settings-icon-link" title="Configurações">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.82 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Sair</a>
        </div>
    </nav>

    <div id="items-count" class="items-count"></div>
    <main id="app-container" class="content-grid">
    </main>

    <div id="video-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <!-- VISÃO 1: Detalhes do Filme (Capa + Info) -->
            <div id="details-view" class="details-view">
                <div class="details-poster-wrapper">
                    <img id="modal-poster" src="" alt="Capa" onerror="this.style.display='none'">
                </div>
                <div class="details-info">
                    <h2 id="modal-title"></h2>
                    <h3 id="modal-original-title"></h3>
                    <div id="modal-genres" class="modal-genres"></div>
                    <div id="modal-meta" class="modal-meta-tags"></div>
                    <p id="modal-synopsis" class="modal-synopsis"></p>
                    <button id="play-btn" class="play-action-btn" title="Assistir">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </div>

            <!-- VISÃO 2: Player de Vídeo -->
            <div id="player-view" class="player-view hidden">
                <div class="video-wrapper">
                    <iframe id="video-frame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    <div class="iframe-blocker"></div>
                </div>
                <div id="player-info-area"></div> <!-- Info replicada aqui via JS -->
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <p>v{{ version }} | Developing in: <a href="{{ github_url }}" target="_blank">GitHub</a></p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
