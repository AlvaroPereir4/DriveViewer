<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Tela principal do navegador de arquivos -->
    <div id="browser-view">
        <header>
            <h1>Drive Viewer</h1>
            <nav id="breadcrumb"></nav>
        </header>
        <main id="file-browser">
            <!-- Catálogo principal e arquivos da pasta serão inseridos aqui -->
        </main>
    </div>

    <!-- Tela de sobreposição para detalhes do item -->
    <div id="details-view" class="hidden">
        <div class="details-content">
            <button class="close-btn">&times;</button>
            <h2 id="details-title"></h2>
            <p id="details-synopsis"></p>
            <button id="details-action-btn">Assistir</button>
        </div>
    </div>

    <!-- Tela de visualização do vídeo -->
    <div id="video-view" class="hidden">
        <button id="back-to-browser-btn"><i class="fas fa-arrow-left"></i> Voltar</button>
        <div id="player-container"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
